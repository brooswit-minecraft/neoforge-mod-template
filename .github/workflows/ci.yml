name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-instantiate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Unit test instantiate.py
        run: python3 -m unittest test_instantiate.py

      - name: Unit test the template's own release scripts
        run: python3 -m unittest discover -s template/scripts

      - name: Instantiate a sample mod
        run: |
          python3 instantiate.py /tmp/sample-mod --slug sample-mod \
            --name "Sample Mod" --description "A sample mod instantiated in CI." \
            --jira-key CI-SAMPLE

      - name: Build the instantiated sample mod
        working-directory: /tmp/sample-mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Check the sample mod's NeoForge floor guard runs
        working-directory: /tmp/sample-mod
        run: python3 scripts/check_neoforge_floor.py
